<title>ნერვული სისტემის ატლასი</title>
<meta name="description" content="ადამიანის ნერვული სისტემის რეალისტური 3D ატლასი: ნორმა და პათოლოგიის განვითარების მექანიზმები.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&family=Noto+Serif+Georgian:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* single deliberate look: a dissection stage — blue-black ground, bone-white ink, myelin gold */
:root{
  color-scheme:dark;
  --stage:#0b0f14; --stage2:#141b23;
  --panel:rgba(17,23,30,.86); --panel-solid:#121820; --line:rgba(236,230,218,.10); --line2:rgba(236,230,218,.18);
  --ink:#ece6da; --ink2:#b9b2a5; --muted:#8a9199;
  --myelin:#e6c46e; --myelin-dim:rgba(230,196,110,.14);
  --lesion:#e2574c; --amber:#e9a23b; --blue:#6b9be0; --green:#63b57d; --grey:#8c8f94;
  --r:10px;
  --serif:"Noto Serif Georgian","Noto Sans Georgian",Georgia,serif;
  --sans:"Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;outline:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--myelin);outline-offset:2px}
a{color:var(--myelin)}

/* ---------- top bar ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:18px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:linear-gradient(180deg,rgba(11,15,20,.92),rgba(11,15,20,0));pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font:600 19px/1.1 var(--serif);letter-spacing:.2px;white-space:nowrap}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mode{display:flex;background:rgba(236,230,218,.06);border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.mode button{border:0;background:transparent;padding:6px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--ink2);white-space:nowrap}
.mode button[aria-pressed="true"]{background:var(--ink);color:#11161c}
.mode button[data-m="patho"][aria-pressed="true"]{background:var(--lesion);color:#fff}
.mode button[data-m="micro"][aria-pressed="true"]{background:#8f78d6;color:#fff}
.mode button[data-m="sim"][aria-pressed="true"]{background:#2f9e8f;color:#fff}
.mode button[data-m="img"][aria-pressed="true"]{background:#4f7fc4;color:#fff}
#imgWrap{position:fixed;z-index:2}
#imgWrap[hidden]{display:none}
#imgCv{display:block;border-radius:10px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.45);touch-action:pan-x}
.imgbar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink2)}
.imgbar input[type=range]{flex:1;min-width:60px;accent-color:var(--myelin)}
body[data-mode="img"] #stage canvas{visibility:hidden}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--line2);background:rgba(236,230,218,.03);border-radius:9px;padding:9px 11px;cursor:pointer;font-size:13px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--ink2)}
.opt.good{border-color:var(--green);background:rgba(99,181,125,.12)}
.opt.bad{border-color:var(--lesion);background:rgba(226,87,76,.10)}
.opt:disabled{cursor:default}
.fb{margin-top:10px;border-left:3px solid var(--ink2);padding:8px 10px;background:rgba(0,0,0,.2);border-radius:0 8px 8px 0;font-size:13px}
.fb.good{border-color:var(--green)}
.fb.bad{border-color:var(--lesion)}
.chip:disabled{opacity:.45;cursor:default}
.top .sp{flex:1}
.toplinks{display:flex;gap:14px;align-items:center;font-size:12.5px}
.toplinks a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line2)}
.toplinks a:hover{color:var(--ink)}

/* ---------- panels ---------- */
.panel{position:fixed;z-index:4;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#left{left:16px;top:74px;bottom:16px;width:268px;display:flex;flex-direction:column;overflow:hidden}
#right{right:16px;top:74px;bottom:16px;width:372px;display:flex;flex-direction:column;overflow:hidden}
#left.col{bottom:auto}
#left.col .scroll{display:none}
#right.col{bottom:auto;max-height:86px}
#right.col .scroll{overflow:hidden}
@media (min-width:761px) and (max-width:1180px){
  #left{width:232px}
  #right{width:318px}
  #attr{display:none}
  #legend{left:262px;max-width:calc(100vw - 610px)}
}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 8px}
.ph h2{margin:0;font:600 12px/1 var(--sans);letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.scroll{overflow:auto;padding:0 10px 14px;flex:1;scrollbar-width:thin;scrollbar-color:rgba(236,230,218,.2) transparent}
.cbtn{display:block;border:0;background:transparent;cursor:pointer;color:var(--ink2);font-size:18px;line-height:1;padding:4px 6px;border-radius:6px}

/* view list (norm) */
.vlist{display:flex;flex-direction:column;gap:2px}
.vitem{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:9px;cursor:pointer}
.vitem:hover{background:rgba(236,230,218,.05)}
.vitem[aria-current="true"]{background:var(--myelin-dim)}
.vitem .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:500 10.5px var(--mono);color:var(--muted)}
.vitem[aria-current="true"] .dot{border-color:var(--myelin);color:var(--myelin)}
.vitem b{display:block;font-weight:500;font-size:13.5px}
.vitem small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:1px}
.layers{display:flex;flex-wrap:wrap;gap:6px;padding:10px 8px 0;border-top:1px solid var(--line);margin-top:10px}
.layers h3{width:100%;margin:0 0 2px;font:600 11px var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--myelin);color:var(--ink);background:var(--myelin-dim)}

/* nosology list */
.search{margin:0 6px 8px;display:block;width:calc(100% - 12px);box-sizing:border-box;background:rgba(236,230,218,.05);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;color:var(--ink);font:inherit}
.ngrp{margin:10px 8px 4px;font:600 11px var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.nitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:9px;cursor:pointer}
.nitem:hover{background:rgba(236,230,218,.05)}
.nitem[aria-current="true"]{background:rgba(226,87,76,.14)}
.nitem b{font-weight:500;font-size:13px;line-height:1.3}
.icd{font:500 10.5px var(--mono);color:var(--ink2);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;white-space:nowrap}

/* right card */
.card-h{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 11px var(--mono);color:var(--muted);letter-spacing:.3px}
.card-h h1{margin:6px 0 2px;font:600 20px/1.25 var(--serif);text-wrap:balance}
.card-h .en{color:var(--ink2);font-size:12.5px}
.sec{padding:14px 18px 4px}
.sec h3{margin:0 0 8px;font:600 11px var(--sans);letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.sec p{margin:0 0 8px;color:var(--ink);font-size:13.5px}
.sec ul{margin:0;padding-left:18px;color:var(--ink);font-size:13px}
.sec li{margin:3px 0}
.refs a{font-size:12.5px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps button{flex:1;border:1px solid var(--line2);background:transparent;border-radius:8px;padding:6px 0;cursor:pointer;font:500 12px var(--mono);color:var(--ink2)}
.steps button[aria-current="true"]{background:var(--lesion);border-color:var(--lesion);color:#fff}
.steps button.done{border-color:rgba(226,87,76,.5);color:var(--ink)}
.stepbox{border:1px solid var(--line);border-radius:10px;padding:12px 13px;background:rgba(0,0,0,.18)}
.stepbox h4{margin:0 0 6px;font:600 15px/1.3 var(--serif)}
.stepbox p{margin:0;font-size:13.5px;color:var(--ink)}
.stepbox .note{margin-top:8px;font-size:12px;color:var(--muted)}
.stepnav{display:flex;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px}
.btn.primary{background:var(--ink);color:#11161c;border-color:var(--ink);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.fact{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.fact dt{color:var(--muted)} .fact dd{margin:0;font-family:var(--mono);font-size:12px}
.disc{margin:8px 18px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.empty{padding:22px 18px;color:var(--ink2)}
.empty b{display:block;font:600 16px var(--serif);color:var(--ink);margin-bottom:6px}

/* legend + hover */
#legend{position:fixed;z-index:3;left:300px;bottom:18px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2);max-width:calc(100vw - 720px)}
#legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--panel-solid);border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12.5px;white-space:nowrap;transform:translate(12px,12px)}
#attr{position:fixed;z-index:3;right:404px;bottom:14px;font-size:10.5px;color:var(--muted);text-align:right}
#attr a{color:var(--muted)}

/* loading */
#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--stage);transition:opacity .5s}
#load.gone{opacity:0;pointer-events:none}
.lbox{width:min(320px,80vw);text-align:center}
.lbox b{font:600 20px var(--serif)}
.lbox p{color:var(--muted);font-size:12.5px;margin:6px 0 14px}
.bar{height:3px;background:rgba(236,230,218,.1);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--myelin);transition:width .2s}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- phone ---------- */
@media (max-width:760px){
  .top{gap:6px 10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;flex-wrap:wrap}
  .brand{flex:1 1 100%}
  .mode{flex:1}
  .mode button{flex:1}
  .brand span,.toplinks .hide-s{display:none}
  .brand b{font-size:15px;white-space:nowrap}
  .top .sp{display:none}
  .mode button{padding:5px 4px;font-size:12px}
  #left{left:10px;right:10px;top:auto;bottom:calc(var(--rh,42vh) + 16px + env(safe-area-inset-bottom,0px));width:auto;max-height:calc(100vh - var(--rh,42vh) - 150px);max-height:calc(100dvh - var(--rh,42vh) - 150px)}
  #left.col{max-height:none;bottom:calc(var(--rh,42vh) + 16px + env(safe-area-inset-bottom,0px))}
  #right{left:10px;right:10px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;height:42vh;height:42dvh}
  #right.col{height:auto;max-height:86px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #legend{left:12px;right:12px;bottom:auto;top:calc(84px + env(safe-area-inset-top,0px));max-width:none;font-size:11px}
  #attr{display:none}
  .card-h{padding:12px 14px 8px}.card-h h1{font-size:17px}
  .sec{padding:10px 14px 2px}
}
</style>

<div id="stage" aria-label="3D მოდელი"></div>

<header class="top">
  <div class="brand"><b>ნერვული სისტემის ატლასი</b><span>BodyParts3D · რეალური ანატომიური გეომეტრია</span></div>

</header>

<aside id="left" class="panel" aria-label="სია">
  <div class="ph"><h2 id="leftTitle">ხედები</h2><button class="cbtn" id="leftC" type="button" aria-label="სიის ჩაკეცვა" aria-expanded="true">⌄</button></div>

<script>window.PACK_URL='pack';
/* ქართული სახელები და ფუნქციები BodyParts3D-ის ინგლისური სახელებისთვის.
   რიგი მნიშვნელოვანია: პირველი დამთხვევა იმარჯვებს. */
const KA_NAMES = [
  // ---- ქერქი ----
  [/precentral gyrus/, 'წინაცენტრალური ხვეული', 'პირველადი მოტორული ქერქი (M1, ბროდმანის 4). საწყისი კორტიკოსპინური გზისთვის; სხეული სომატოტოპიურად არის წარმოდგენილი (მოტორული ჰომუნკულუსი).'],
  [/postcentral gyrus/, 'უკანაცენტრალური ხვეული', 'პირველადი სომატოსენსორული ქერქი (S1, ბროდმანის 3, 1, 2): შეხება, ტკივილი, ტემპერატურა, პროპრიოცეფცია კონტრალატერალური სხეულიდან.'],
  [/superior frontal gyrus/, 'ზედა შუბლის ხვეული', 'დამატებითი მოტორული არე მედიალურ ზედაპირზე; მოძრაობის დაგეგმვა, აღმასრულებელი ფუნქციები.'],
  [/middle frontal gyrus/, 'შუა შუბლის ხვეული', 'შუბლის თვალის ველი (ბროდმანის 8), სამუშაო მეხსიერება, ყურადღება.'],
  [/inferior frontal gyrus/, 'ქვედა შუბლის ხვეული', 'დომინანტურ (ჩვეულებრივ მარცხენა) ნახევარსფეროში — ბროკას არე (ბროდმანის 44, 45): მეტყველების მოტორული დაგეგმვა.'],
  [/orbital gyrus|straight gyrus/, 'ორბიტული ხვეულები', 'ორბიტოფრონტალური ქერქი: ემოციური ქცევა, ჯილდოზე დაფუძნებული გადაწყვეტილებები.'],
  [/superior parietal lobule/, 'ზედა თხემის წილაკი', 'სივრცითი ორიენტაცია, სხეულის სქემა, სომატოსენსორული და მხედველობითი ინფორმაციის ინტეგრაცია.'],
  [/supramarginal gyrus/, 'კიდისზედა ხვეული', 'სენსორული ინტეგრაცია; დომინანტურ ნახევარსფეროში — ფონოლოგიური დამუშავება, პრაქსისი.'],
  [/angular gyrus/, 'კუთხოვანი ხვეული', 'კითხვა, წერა, ანგარიში (დომინანტურ ნახევარსფეროში); დაზიანება — გერსტმანის სინდრომი.'],
  [/posterior part of .*superior temporal gyrus/, 'ზედა საფეთქლის ხვეული (უკანა ნაწილი)', 'დომინანტურ ნახევარსფეროში — ვერნიკეს არე: მეტყველების გაგება.'],
  [/superior temporal gyrus/, 'ზედა საფეთქლის ხვეული', 'სმენის ქერქი (ჰეშლის ხვეულები, ბროდმანის 41, 42).'],
  [/middle temporal gyrus/, 'შუა საფეთქლის ხვეული', 'სემანტიკური მეხსიერება, მოძრაობის მხედველობითი აღქმა (V5/MT).'],
  [/inferior temporal gyrus/, 'ქვედა საფეთქლის ხვეული', 'ობიექტების მხედველობითი ამოცნობა (ვენტრალური, „რა" გზა).'],
  [/fusiform gyrus/, 'თითისტარისებრი ხვეული', 'სახეებისა და სიტყვების ვიზუალური ამოცნობა; დაზიანება — პროზოპაგნოზია.'],
  [/parahippocampal gyrus/, 'ჰიპოკამპისპირა ხვეული', 'ენტორინული ქერქის ნაწილი: ჰიპოკამპის მთავარი შესასვლელი; მეხსიერება, სივრცითი ნავიგაცია.'],
  [/occipital lobe/, 'კეფის წილი', 'მხედველობის ქერქი (V1 — ბროდმანის 17, შპორისებრი ღარის გარშემო) და მხედველობითი ასოციაციური არეები.'],
  [/cingulate gyrus/, 'სარტყლისებრი ხვეული', 'ლიმბური სისტემა: ემოცია, მოტივაცია, შეცდომის მონიტორინგი, ტკივილის აფექტური კომპონენტი.'],
  [/insula/, 'კუნძული (ინსულა)', 'ინტეროცეფცია, გემო, ვეგეტატიური კონტროლი, ემპათია.'],
  [/accessory short gyrus/, 'კუნძულის მოკლე ხვეული', 'კუნძულის წინა ნაწილი: ვისცერული და გემოვნებითი ინფორმაცია.'],
  // ---- ნათხემი, ღერო ----
  [/cerebellum/, 'ნათხემი', 'მოძრაობის კოორდინაცია, წონასწორობა, კუნთის ტონუსი, მოტორული სწავლება. დაზიანება — იპსილატერალური ატაქსია.'],
  [/peduncle of midbrain|cerebral crus/, 'ტვინის ფეხი', 'შუა ტვინის ვენტრალური ნაწილი: კორტიკოსპინური და კორტიკობულბური ბოჭკოები.'],
  [/midbrain/, 'შუა ტვინი', 'შეიცავს შავ სუბსტანციას (დოფამინერგული ნეირონები), წითელ ბირთვს, III–IV ნერვის ბირთვებს; მხედველობისა და სმენის რეფლექსები.'],
  [/pons/, 'ხიდი', 'V–VIII ნერვის ბირთვები, კორტიკოპონტოცერებელური გზა, სუნთქვის რეგულაცია.'],
  [/medulla oblongata/, 'მოგრძო ტვინი', 'სუნთქვის და გულ-სისხლძარღვთა ცენტრები, IX–XII ნერვის ბირთვები, პირამიდების ჯვარედინი.'],
  // ---- ღრმა სტრუქტურები ----
  [/thalamus/, 'თალამუსი', 'სენსორული და მოტორული ინფორმაციის რელე ქერქისკენ (ყნოსვის გარდა); ცნობიერება, ყურადღება.'],
  [/caudate nucleus/, 'კუდიანი ბირთვი', 'სტრიატუმის ნაწილი (ბაზალური განგლიები): მოძრაობის ინიციაცია, სწავლება, ქცევა.'],
  [/putamen/, 'ნაჭუჭი (პუტამენი)', 'სტრიატუმის ნაწილი: იღებს ნიგროსტრიატულ დოფამინს; მოტორული მარყუჟის მთავარი რგოლი.'],
  [/globus pallidus/, 'ფერმკრთალი ბირთვი', 'ბაზალური განგლიების ინჰიბიციური გამოსავალი (GPi) თალამუსისკენ.'],
  [/hippocampus/, 'ჰიპოკამპი', 'ახალი დეკლარაციული მეხსიერების ფორმირება, სივრცითი მეხსიერება. ალცჰაიმერის დაავადებისას ადრე ზიანდება.'],
  [/amygdala/, 'ნუშისებრი სხეული', 'შიში, ემოციური მეხსიერება, საფრთხის შეფასება.'],
  [/hypothalamus|tuber cinereum|mammillary/, 'ჰიპოთალამუსი', 'ჰომეოსტაზი: თერმორეგულაცია, შიმშილი, წყურვილი, ცირკადული რიტმი, ჰიპოფიზის კონტროლი.'],
  [/internal capsule/, 'შიგნითა კაფსულა', 'ვიწრო თეთრი ნივთიერება ბაზალურ განგლიებსა და თალამუსს შორის; უკანა ფეხში გადის კორტიკოსპინური გზა. მცირე ლაკუნური ინფარქტიც იწვევს ჰემიპარეზს.'],
  [/corpus callosum/, 'კორძიანი სხეული', 'ნახევარსფეროთა შორის უდიდესი კომისურა.'],
  [/fornix/, 'თაღი (ფორნიქსი)', 'ჰიპოკამპის გამომტანი გზა მამილარული სხეულებისკენ (პაპესის წრე).'],
  [/white matter/, 'ნახევარსფეროს თეთრი ნივთიერება', 'მიელინიანი აქსონები: ასოციაციური, კომისურული და პროექციული ბოჭკოები.'],
  [/geniculate/, 'დაკბილული სხეული', 'ლატერალური — მხედველობის რელე; მედიალური — სმენის რელე.'],
  [/colliculus/, 'ოთხგორაკის ბორცვი', 'ზედა — მხედველობითი რეფლექსები; ქვედა — სმენის გზის რელე.'],
  [/septum|commissure|habenula|stria|lamina terminalis|interpeduncular/, 'შუა ხაზის სტრუქტურა', 'ლიმბური და კომისურული კავშირები.'],
  [/lateral ventricle/, 'გვერდითი პარკუჭი', 'ლიქვორის (ცერებროსპინური სითხის) სივრცე; ქოროიდული წნული ლიქვორს გამოიმუშავებს.'],
  [/third ventricle/, 'მესამე პარკუჭი', 'შუა ხაზზე თალამუსებს შორის; უკავშირდება წყალსადენს.'],
  [/fourth ventricle/, 'მეოთხე პარკუჭი', 'ხიდსა და ნათხემს შორის; ლიქვორი აქედან სუბარაქნოიდულ სივრცეში გადის.'],
  [/cerebral aqueduct/, 'ტვინის წყალსადენი (სილვიუსის)', 'მესამე და მეოთხე პარკუჭის კავშირი; სტენოზი — ობსტრუქციული ჰიდროცეფალია.'],
  [/interventricular foramen/, 'პარკუჭთაშუა ხვრელი (მონროს)', 'აკავშირებს გვერდით და მესამე პარკუჭს.'],
  [/central canal/, 'ზურგის ტვინის ცენტრალური არხი', 'ლიქვორით სავსე არხი ზურგის ტვინის შუაში.'],
  // ---- თავის ტვინის ნერვები ----
  [/olfactory/, 'ყნოსვის ნერვი (I)', 'სენსორული: ყნოსვა.'],
  [/optic chiasm/, 'მხედველობის ჯვარედინი', 'ბადურის ნაზალური ნახევრების ბოჭკოები გადაჯვარედინდება; დაზიანება — ბიტემპორული ჰემიანოპსია.'],
  [/optic tract/, 'მხედველობის ტრაქტი', 'ჯვარედინის შემდეგ ლატერალური დაკბილული სხეულისკენ; დაზიანება — ჰომონიმური ჰემიანოპსია.'],
  [/optic nerve/, 'მხედველობის ნერვი (II)', 'სენსორული: მხედველობა. ცნს-ის ნაწილია (ოლიგოდენდროციტური მიელინი), ამიტომ ზიანდება გაფანტული სკლეროზისას.'],
  [/oculomotor|nerve to .*(rectus|oblique|levator)|ciliary ganglion/, 'თვალის მამოძრავებელი ნერვი (III)', 'თვალის კუნთების უმეტესობა, ზედა ქუთუთოს ამწევი, გუგის შევიწროება (პარასიმპათიკური).'],
  [/\btrochlear/, 'ჭაღის ნერვი (IV)', 'თვალის ზედა ირიბი კუნთი.'],
  [/ophthalmic|frontal nerve|lacrimal|nasociliary|ethmoidal|supra-?orbital|supratrochlear|infratrochlear|ciliary nerve/, 'სამწვერა ნერვის თვალის ტოტი (V1)', 'სენსორული: შუბლი, ზედა ქუთუთო, რქოვანა, ცხვირის ზურგი.'],
  [/maxillary|infra-?orbital|zygomatic nerve|alveolar|palatine|nasopalatine|nasal nerve|pterygopalatine/, 'სამწვერა ნერვის ზედა ყბის ტოტი (V2)', 'სენსორული: ლოყა, ზედა ტუჩი, ზედა კბილები, ცხვირის ღრუ, სასა.'],
  [/mandibular|lingual|mental|buccal nerve|auriculotemporal|masseteric|pterygoid nerve|mylohyoid|\btensor|otic ganglion|meningeal/, 'სამწვერა ნერვის ქვედა ყბის ტოტი (V3)', 'სენსორული: ქვედა ყბა, ქვედა კბილები, ენის წინა 2/3 (ზოგადი მგრძნობელობა); მოტორული: საღეჭი კუნთები.'],
  [/trigeminal/, 'სამწვერა ნერვი (V)', 'სახის მგრძნობელობა (V1–V3) და საღეჭი კუნთები. ნევრალგიის ყველაზე ხშირი სამიზნე.'],
  [/abducens/, 'განმზიდველი ნერვი (VI)', 'თვალის ლატერალური სწორი კუნთი.'],
  [/\bfacial|posterior auricular/, 'სახის ნერვი (VII)', 'მიმიკური კუნთები, m. stapedius; გემო ენის წინა 2/3-ზე (chorda tympani); ცრემლისა და ნერწყვის ჯირკვლები.'],
  [/vestibulocochlear/, 'კარიბჭე-ლოკოკინის ნერვი (VIII)', 'სმენა და წონასწორობა.'],
  [/glossopharyngeal|pharyngeal nerve/, 'ენა-ხახის ნერვი (IX)', 'ენის უკანა 1/3 (გემო, მგრძნობელობა), ხახა, საძილე სინუსი; ყბაყურა ჯირკვალი.'],
  [/recurrent laryngeal/, 'ხორხის უკუქცევითი ნერვი (X-ის ტოტი)', 'ხორხის შინაგანი კუნთები (ფარისებრ-ხაპური უკანა კუნთის გარდა ყველა); დაზიანება — ხმის ჩახლეჩა.'],
  [/vagus/, 'ცთომილი ნერვი (X)', 'გულის, ფილტვის, კუჭ-ნაწლავის პარასიმპათიკური ინერვაცია; ხახა, ხორხი.'],
  [/accessory nerve/, 'დამატებითი ნერვი (XI)', 'მკერდ-ლავიწ-დვრილისებრი და ტრაპეციული კუნთები.'],
  [/hypoglossal/, 'ენისქვეშა ნერვი (XII)', 'ენის კუნთები; დაზიანებისას ენა გადაიხრება დაზიანების მხარეს.'],
  // ---- ზურგის ტვინი, ნერვები ----
  [/cauda equina/, 'ცხენის კუდი', 'L2–Co ფესვები ზურგის ტვინის კონუსის (≈L1–L2) ქვემოთ.'],
  [/neural tissue of spinal cord|spinal cord/, 'ზურგის ტვინი', 'აღმავალი (სენსორული) და დაღმავალი (მოტორული) გზები; წინა რქებში ქვედა მოტორული ნეირონები; სეგმენტური რეფლექსები.'],
  [/superior trunk of .*brachial/, 'მხრის წნულის ზედა ღერო (C5–C6)', 'დაზიანება — ერბ-დიუშენის დამბლა.'],
  [/middle trunk of .*brachial/, 'მხრის წნულის შუა ღერო (C7)', 'გრძელდება ყველა კონაში.'],
  [/inferior trunk of .*brachial/, 'მხრის წნულის ქვედა ღერო (C8–T1)', 'დაზიანება — კლუმპკეს დამბლა (მტევნის შიგნითა კუნთები).'],
  [/lateral cord of .*brachial/, 'მხრის წნულის ლატერალური კონა', 'იძლევა კუნთოვან-კანის ნერვს და მედიანური ნერვის ლატერალურ ფესვს.'],
  [/medial cord of .*brachial/, 'მხრის წნულის მედიალური კონა', 'იძლევა იდაყვის ნერვს და მედიანური ნერვის მედიალურ ფესვს.'],
  [/posterior cord of .*brachial/, 'მხრის წნულის უკანა კონა', 'იძლევა სხივისა და იღლიის ნერვებს.'],
  [/digital branch .*median|median nerve to/, 'მედიანური ნერვის თითის ტოტი', 'მგრძნობელობა I–III და IV თითის რადიალური ნახევრის პალმარულ ზედაპირზე.'],
  [/digital branch .*radial|radial nerve to/, 'სხივის ნერვის თითის ტოტი', 'მგრძნობელობა I–II თითის ზურგზე.'],

function kaName(en){
  const n = en.toLowerCase().replace(' (mirrored)','');
  const side = /\bleft\b/.test(n) ? 'მარცხენა ' : /\bright\b/.test(n) ? 'მარჯვენა ' : '';
  for (const [re, ka, fn] of KA_NAMES) if (re.test(n)) return { ka: side + ka, fn };
  return { ka: en, fn: '' };
}

function simSuccess(fb) { const st = curSim.steps[simStep]; simDone = true; simFb = { ok: 1, t: fb || st.okFb }; simClock += st.min || 0; if (st.done && curSim.scene !== 'nerve') applyFx(st.done, curSim); renderRight(); }
function simWrong(t, pen = 0) { simErr++; simPenalty += pen; simClock += pen; simFb = { ok: 0, t }; renderRight(); }
function simClick(ev) {
  const st = curSim && curSim.steps[simStep]; if (!st || st.type !== 'tool' || simDone) return;
  if (!simTool) { simFb = { ok: null, t: 'ჯერ აირჩიეთ ინსტრუმენტი ბარათში.' }; renderRight(); return; }
  if (curSim.scene === 'nerve') {
    const id = MICRO.pickNerve(ev, R.domElement.getBoundingClientRect()); if (!id) return;
    if (!st.nerveTarget.includes(id)) { simWrong(st.miss); return; }
    if (/^end/.test(id)) { MICRO.nerve.debride(id); simMulti.add(id); if (simMulti.size >= (st.need || st.nerveTarget.length)) simSuccess(); else { simFb = { ok: null, t: (id === 'endP' ? 'პროქსიმალური' : 'დისტალური') + ' ბოლო მომზადებულია. ახლა მეორე ბოლო.' }; renderRight(); } }
    else { const n = MICRO.nerve.suture(id); if (n >= (st.need || 4)) { MICRO.nerve.showSutures(false); simSuccess(); } else { simFb = { ok: null, t: `ნაკერი ${n}/${st.need || 4}` }; renderRight(); } }
    return;
  }
  const r = R.domElement.getBoundingClientRect(); mv.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mv, cam);
  const cands = ALL.filter(m => m.visible && m.material !== skinMat && (m.material.opacity == null || m.material.opacity > .05)).concat(fxRoot.children.filter(o => o.isMesh));
  const hits = ray.intersectObjects(cands, false); if (!hits.length) return;
  // the clicked ray may pass through translucent tissue first: accept if any hit along it reaches the target
  const near = (h, t) => h.point.distanceTo(anchor(t.at)) < t.r || (t.mesh && h.object.userData && re(t.mesh).test(h.object.userData.lname || ''));
  if (hits.some(h => near(h, st.target))) { simSuccess(); return; }
  for (const a of st.alt || []) if (hits.slice(0, 3).some(h => near(h, a))) { simWrong(a.fb, 10); return; }
  simWrong(st.miss);
}
function renderSimLeft(L) {
  $('#leftTitle').textContent = 'ჩარევა · მოდელირებები';
  L.innerHTML = '<div class="vlist">' + SIMS.map(s => `<button class="vitem" type="button" data-sim="${s.id}" aria-current="${s === curSim}"><span class="dot">${esc(s.icon || '⚕')}</span><span><b>${esc(s.ka)}</b><small>${esc(s.kind)}</small></span></button>`).join('') + '</div>' + (SIM_SOON.length ? 
    '<div class="layers" style="display:block"><h3>შემდეგ ეტაპზე</h3>' + SIM_SOON.map(([t, s]) => `<div class="vitem" style="opacity:.5;cursor:default"><span class="dot">·</span><span><b>${esc(t)}</b><small>${esc(s)}</small></span></div>`).join('') + '</div>' : '');
}
function renderSimRight(B) {
  const s = curSim, n = s.steps.length, st = s.steps[simStep];
  const clock = s.clock != null ? `<span class="icd">⏱ ${simClock} წთ სიმპტომიდან</span>` : '';
  const dots = `<div class="steps">${s.steps.map((x, i) => `<button type="button" disabled aria-current="${i === simStep}" class="${i < simStep ? 'done' : ''}" title="${esc(x.t)}">${i + 1}</button>`).join('')}</div>`;
  let body = '';
  if (!st) {
    const neur = s.clock != null && simPenalty ? `<p>შეცდომებით დაკარგული დრო: <b>${simPenalty} წთ</b>. ეს დაახლოებით <b>${(simPenalty * 1.9).toFixed(0)} მილიონი ნეირონია</b>, თუ ჩავთვლით, რომ ≈ 1,9 მლნ ნეირონი იღუპება ყოველ წუთში (Saver, Stroke 2006).</p>` : '';
    body = `<div class="sec"><h3>შედეგი</h3><div class="stepbox"><h4>${simErr ? 'მოდელირება დასრულდა' : 'უშეცდომოდ დასრულდა'}</h4><p>შეცდომები: <b>${simErr}</b>${s.clock != null ? ` · დრო სიმპტომიდან რეპერფუზიამდე და მართვის ბოლომდე: <b>${simClock} წთ</b>` : ''}</p>${neur}</div>
      <div class="stepnav"><button class="btn primary" type="button" id="simRestart">თავიდან ↺</button></div></div>
      <div class="sec refs"><h3>წყაროები</h3><ul>${s.refs.map(([t, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul></div>`;
  } else {
    let act = '';
    const order = st.opts ? st.opts.map((_, i) => i).sort((a, b) => ((a * 7 + simStep * 3 + 5) % 11) - ((b * 7 + simStep * 3 + 5) % 11)) : [];
    if (st.type === 'choice') act = `<div class="opts">${order.map(i => [st.opts[i], i]).map(([o, i]) => `<button type="button" class="opt ${simChosen[i] ? (o.ok ? 'good' : 'bad') : ''}" data-opt="${i}" ${simDone ? 'disabled' : ''}>${esc(o.t)}</button>`).join('')}</div>`;
    if (st.type === 'tool') act = `<h3 style="margin:10px 0 6px">ინსტრუმენტები</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${st.tools.map(([id, t]) => `<button type="button" class="chip" data-tool="${id}" aria-pressed="${simTool === id}" ${simDone ? 'disabled' : ''}>${esc(t)}</button>`).join('')}</div>`;
    if (st.type === 'slider') { const v = Math.round(MICRO.nerve.getRot()); act = `<label for="rotS" style="display:block;margin:10px 0 4px;color:var(--ink2);font-size:12.5px">დისტალური ბოლოს ბრუნვა: <b id="rotV" style="font-family:var(--mono)">${v}°</b></label><input id="rotS" type="range" min="-90" max="90" step="1" value="${v}" style="width:100%" ${simDone ? 'disabled' : ''}>`; }
    const fb = simFb ? `<div class="fb ${simFb.ok === 1 ? 'good' : simFb.ok === 0 ? 'bad' : ''}">${esc(simFb.t)}</div>` : '';
    body = `<div class="sec">${dots}<div class="stepbox"><h4>${simStep + 1}. ${esc(st.t)}</h4><p>${esc(st.q)}</p>${st.fx && st.fx.note ? `<p class="note">${esc(st.fx.note)}</p>` : ''}${act}${fb}</div>
      <div class="stepnav"><button class="btn primary" type="button" id="simNext" ${simDone ? '' : 'disabled'}>${simStep < n - 1 ? 'შემდეგი ეტაპი →' : 'შედეგის ნახვა →'}</button><button class="btn" type="button" id="simRestart">თავიდან</button></div></div>`;
  }
  B.innerHTML = `<div class="card-h"><div class="eyebrow"><span>ჩარევა</span><span>·</span><span>${esc(s.kind)}</span>${clock}</div><h1>${esc(s.ka)}</h1><div class="en">${esc(s.en)}</div></div>
    <div class="sec"><details ${simStep === 0 ? 'open' : ''}><summary style="cursor:pointer;color:var(--muted);font:600 11px var(--sans);letter-spacing:.9px;text-transform:uppercase">შემთხვევა</summary><p style="margin-top:8px">${esc(s.case)}</p></details></div>${body}
    <p class="disc">სასწავლო მოდელირება; არ ცვლის კლინიკურ გაიდლაინებს და ქირურგიულ სწავლებას. გადაწყვეტილებები ეყრდნობა მითითებულ გაიდლაინებს/მიმოხილვებს.</p>`;
  const rs = document.getElementById('rotS'); if (rs) rs.oninput = () => { const v = +rs.value; MICRO.nerve.setRot(v); document.getElementById('rotV').textContent = v + '°'; if (Math.abs(v) <= st.tol && !simDone) simSuccess(); };
}
$('#rightBody').addEventListener('click', e => {
  if (mode !== 'sim') return; const st = curSim.steps[simStep];
  const o = e.target.closest('[data-opt]'); if (o && !simDone) { const i = +o.dataset.opt, op = st.opts[i]; simChosen[i] = 1; if (op.ok) { simClock += op.min || 0; simSuccess(op.fb); } else simWrong(op.fb, op.min || 0); return; }

  if (e.target.id === 'simRestart') openSim(curSim);
});
$('#leftBody').addEventListener('click', e => { const b = e.target.closest('[data-sim]'); if (b) openSim(SIMS.find(s => s.id === b.dataset.sim)); });

  goCam('body'); tween.t = 1; ctl.target.copy(tween.tt); cam.position.copy(tween.tp); tween = null;

})();
